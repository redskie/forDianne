<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>For Dianne &mdash; From Red</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #253338;
      --ink-muted: rgba(37, 51, 56, 0.62);
      --pill-bg: rgba(255, 255, 255, 0.62);
      --pill-border: rgba(255, 255, 255, 0.78);
      --pill-active-bg: #233338;
      --pill-active-text: #fcfaf7;
      --heart-glow: rgba(235, 134, 122, 0.38);
      --beat-sec: 1.05s;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background-color: #cde8ec;
      transition: color 1.1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .font-editorial {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    .font-handwritten {
      font-family: 'Caveat', cursive;
    }

    /* =========================================================================
       FROSTED GLASS ALBUM BACKDROP STACK
       ========================================================================= */
    .backdrop-stack {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .album-layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(1.05);
      filter: blur(9px) saturate(118%);
      transition: opacity 1.35s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 1.8s cubic-bezier(0.22, 1, 0.36, 1);
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .album-layer.is-active {
      opacity: 1;
      transform: scale(1.02);
    }

    .album-cover-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    #ambianceCanvas {
      width: 100%;
      height: 100%;
    }

    /* Painterly fallback gradients matching the 3 uploaded album covers */
    /* 1. Stevie Wonder - Isn't She Lovely (Turquoise Sky -> Sunset Peach + White Hibiscus) */
    .art-fallback-lovely {
      background:
        radial-gradient(circle at 50% 46%, rgba(255, 255, 255, 0.92) 0%, rgba(255, 250, 245, 0.45) 18%, transparent 42%),
        radial-gradient(circle at 72% 76%, rgba(242, 179, 148, 0.85) 0%, transparent 48%),
        linear-gradient(180deg, #09a6c8 0%, #52c6d8 48%, #f3c4be 86%, #f5b3a8 100%);
    }

    /* 2. Belle Mariano - For Your Eyes Only (Daylight: Forest Moss, White Wisteria, Crimson Blooms, Mist) */
    .art-fallback-eyes {
      background:
        radial-gradient(circle at 48% 72%, rgba(252, 251, 246, 0.96) 0%, rgba(242, 245, 236, 0.72) 28%, transparent 56%),
        radial-gradient(circle at 16% 24%, rgba(168, 32, 38, 0.65) 0%, transparent 34%),
        radial-gradient(circle at 82% 54%, rgba(176, 38, 44, 0.55) 0%, transparent 36%),
        radial-gradient(circle at 52% 18%, rgba(235, 242, 226, 0.75) 0%, transparent 46%),
        linear-gradient(165deg, #4b6138 0%, #6d834e 45%, #dfe6d5 85%, #f7f7f0 100%);
    }

    /* 3. Laufey - Magnolia (Typical of Me: Warm Ivory Polaroid Frame, Studio Charcoal Shadow, Rose-Amber) */
    .art-fallback-magnolia {
      background:
        radial-gradient(circle at 48% 46%, rgba(196, 154, 134, 0.55) 0%, rgba(72, 62, 58, 0.72) 34%, rgba(246, 241, 231, 0.96) 66%),
        linear-gradient(160deg, #f7f3e8 0%, #ece3d3 50%, #f5efe2 100%);
    }

    /* Translucent Frosted Glass Veil over the blurred album art */
    .frosted-glass-pane {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      backdrop-filter: blur(6px) saturate(114%);
      -webkit-backdrop-filter: blur(6px) saturate(114%);
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.20) 0%,
        rgba(255, 255, 255, 0.08) 50%,
        rgba(255, 255, 255, 0.24) 100%
      );
      transition: background 1.2s ease;
    }

    body.mode-eyes .frosted-glass-pane {
      background: linear-gradient(
        180deg,
        rgba(244, 248, 238, 0.18) 0%,
        rgba(255, 255, 255, 0.07) 50%,
        rgba(248, 250, 242, 0.24) 100%
      );
    }

    body.mode-magnolia .frosted-glass-pane {
      background: linear-gradient(
        180deg,
        rgba(250, 245, 236, 0.22) 0%,
        rgba(245, 237, 224, 0.10) 50%,
        rgba(250, 244, 234, 0.26) 100%
      );
    }

    /* Subtle tactile paper & film grain overlay */
    .paper-grain {
      position: fixed;
      inset: 0;
      z-index: 40;
      pointer-events: none;
      opacity: 0.05;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Organic Heart Motion Loops */
    .heart-motion {
      will-change: transform;
      transform-origin: center center;
    }

    /* 1. Sunlit Island Breeze Bounce ("Isn't She Lovely" — Stevie Wonder) */
    @keyframes motionLovely {
      0%   { transform: scale(1) rotate(0deg); }
      15%  { transform: scale(1.10) rotate(-1.6deg); }
      30%  { transform: scale(1.01) rotate(0.6deg); }
      45%  { transform: scale(1.14) rotate(1.6deg); }
      75%  { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .motion-lovely {
      animation: motionLovely var(--beat-sec) cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
    }

    /* 2. Dew-Kissed Botanical Pearl Sway ("For Your Eyes Only" — Belle Mariano) */
    @keyframes motionEyes {
      0%, 100% { transform: scale(0.98) rotate(-2deg) translateY(0px); }
      50%      { transform: scale(1.07) rotate(2deg) translateY(-5px); }
    }
    .motion-eyes {
      animation: motionEyes calc(var(--beat-sec) * 2.2) cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    /* 3. Warm Vinyl-Waltz Heartbeat ("Magnolia" — Laufey) */
    @keyframes motionMagnolia {
      0%, 100% { transform: scale(0.97) rotate(-1.2deg) translateY(3px); }
      35%      { transform: scale(1.08) rotate(1.4deg) translateY(-5px); }
      68%      { transform: scale(1.03) rotate(-0.5deg) translateY(-1px); }
    }
    .motion-magnolia {
      animation: motionMagnolia calc(var(--beat-sec) * 2.0) cubic-bezier(0.37, 0, 0.63, 1) infinite;
    }

    /* Mode Switch Morph Transition */
    .heart-morph-out {
      transform: scale(0.84) rotate(-6deg) !important;
      opacity: 0.2 !important;
      filter: blur(8px) !important;
    }

    .heart-art-layer {
      transition: opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                  filter 0.85s ease;
    }

    /* Center Magnetic Drop Zone Ring */
    .heart-sanctuary {
      position: relative;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .sanctuary-ring {
      position: absolute;
      inset: -16px;
      border-radius: 9999px;
      border: 1px dashed rgba(255, 255, 255, 0.65);
      box-shadow: inset 0 0 24px rgba(255, 255, 255, 0.25);
      opacity: 0.65;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                  opacity 0.4s ease,
                  border-color 0.4s ease,
                  box-shadow 0.4s ease;
      pointer-events: none;
    }

    .heart-sanctuary.is-targeted .sanctuary-ring {
      transform: scale(1.14);
      opacity: 1;
      border-style: solid;
      border-color: var(--ink);
      box-shadow: 0 0 46px var(--heart-glow), inset 0 0 28px rgba(255, 255, 255, 0.45);
    }

    .heart-sanctuary.is-targeted {
      transform: scale(1.06);
    }

    /* Orbiting / Hovering Mode Charms (The ONLY 3 Buttons) */
    .orbit-anchor {
      position: absolute;
      z-index: 30;
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes floatCharmA {
      0%, 100% { transform: translate(0px, 0px); }
      50%      { transform: translate(-4px, -8px); }
    }
    @keyframes floatCharmB {
      0%, 100% { transform: translate(0px, 0px); }
      50%      { transform: translate(5px, -7px); }
    }
    @keyframes floatCharmC {
      0%, 100% { transform: translate(0px, 0px); }
      50%      { transform: translate(0px, 8px); }
    }

    .charm-float-0 { animation: floatCharmA 5.4s ease-in-out infinite; }
    .charm-float-1 { animation: floatCharmB 6.1s ease-in-out infinite 0.6s; }
    .charm-float-2 { animation: floatCharmC 5.8s ease-in-out infinite 1.2s; }

    .mode-charm {
      touch-action: none;
      cursor: grab;
      background: var(--pill-bg);
      color: var(--ink);
      border: 1px solid var(--pill-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 26px -6px rgba(20, 24, 28, 0.14), 0 2px 6px rgba(20, 24, 28, 0.06);
      transition: background-color 0.75s ease,
                  color 0.75s ease,
                  border-color 0.75s ease,
                  box-shadow 0.45s ease,
                  transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .mode-charm:active {
      cursor: grabbing;
    }

    .mode-charm.is-selected {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      border-color: var(--pill-active-bg);
      box-shadow: 0 14px 32px -6px var(--heart-glow);
    }

    .mode-charm.is-dragging {
      position: fixed !important;
      z-index: 9999 !important;
      transition: none !important;
      animation: none !important;
      transform: scale(1.08) rotate(-2deg) !important;
      box-shadow: 0 22px 44px rgba(0, 0, 0, 0.24) !important;
      pointer-events: none;
    }

    .whisper-fade {
      transition: opacity 0.9s ease, color 0.9s ease, transform 0.9s ease;
    }

    @media (max-width: 600px) {
      #anchor-0,
      #anchor-1 {
        top: 3%;
      }
    }

    @media (max-width: 380px) {
      .mode-charm {
        gap: 0.35rem;
        padding: 0.55rem 0.65rem;
        font-size: 0.65rem;
      }

      #anchor-0 { left: 2%; }
      #anchor-1 { right: 2%; }
    }

    @media (max-height: 640px) {
      header.relative { padding-top: 1rem; }
      footer.relative { padding-bottom: 1rem; }
      #heartSanctuary {
        width: clamp(8rem, 28vh, 10rem);
        height: clamp(8rem, 28vh, 10rem);
      }

      #heartMotionWrapper {
        width: clamp(7rem, 24vh, 9rem);
        height: clamp(7rem, 24vh, 9rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

    class HybridMusicController {
      constructor() {
        this.htmlAudio = {};
        this.ctx = null;
        this.master = null;
        this.isStarted = false;
        this.currentMode = 'lovely';
        this.synthStep = 0;
        this.synthTimer = null;
        this.fadeIntervals = {};
        this.playbackRequest = 0;

        // Create players without downloading tracks until playback is requested.
        Object.entries(SONG_CONFIG).forEach(([key, cfg]) => {
          const el = new Audio();
          el.src = cfg.audioSrc;
          el.loop = true;
          el.preload = 'none';
          el.volume = 0;
          this.htmlAudio[key] = el;
        });
      }

      unlockSynth() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
          this.master = this.ctx.createGain();
          this.master.gain.value = 0.26;
          this.master.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      start() {
        if (this.isStarted) return;
        this.isStarted = true;
        this.playMode(this.currentMode);
      }

      setMode(modeKey) {
        if (this.currentMode === modeKey && this.isStarted) return;
        this.currentMode = modeKey;
        if (!this.isStarted) {
          this.start();
          return;
        }
        this.playMode(modeKey);
      }

      playMode(modeKey) {
        const requestId = ++this.playbackRequest;
        this.stopSynth();
        this.crossfadeHtmlAudio(modeKey, requestId);
      }

      async crossfadeHtmlAudio(targetKey, requestId) {
        Object.entries(this.htmlAudio).forEach(([key, el]) => {
          clearInterval(this.fadeIntervals[key]);
          if (key === targetKey) {
            el.volume = 0;
          } else {
            this.fadeIntervals[key] = setInterval(() => {
              if (el.volume > 0.04) {
                el.volume = Math.max(0, el.volume - 0.06);
              } else {
                el.volume = 0;
                el.pause();
                clearInterval(this.fadeIntervals[key]);
              }
            }, 45);
          }
        });

        const targetAudio = this.htmlAudio[targetKey];
        try {
          await targetAudio.play();
        } catch (error) {
          if (requestId !== this.playbackRequest || this.currentMode !== targetKey) return;
          console.warn(`Unable to play the local track for "${targetKey}".`, error);
          this.fadeOutAllHtmlAudio();
          const whisper = document.getElementById('whisperHint');
          if (window.location.protocol === 'file:') {
            whisper.textContent = 'Open this page from a local server to play the MP3 tracks';
            return;
          }
          whisper.textContent = 'Track unavailable · playing the built-in fallback';
          this.startSynth(targetKey);
          return;
        }

        if (requestId !== this.playbackRequest || this.currentMode !== targetKey) return;
        this.stopSynth();
        const whisper = document.getElementById('whisperHint');
        if (whisper.textContent.startsWith('Track unavailable')) {
          whisper.textContent = 'Draw a song into the heart · or tap to switch';
        }
        this.fadeIntervals[targetKey] = setInterval(() => {
          if (targetAudio.volume < 0.85) {
            targetAudio.volume = Math.min(0.85, targetAudio.volume + 0.05);
          } else {
            clearInterval(this.fadeIntervals[targetKey]);
          }
        }, 45);
      }

      fadeOutAllHtmlAudio() {
        Object.entries(this.htmlAudio).forEach(([key, el]) => {
          clearInterval(this.fadeIntervals[key]);
          el.volume = 0;
          el.pause();
        });
      }

      startSynth(modeKey) {
        this.unlockSynth();
        this.stopSynth();
        this.synthStep = 0;
        this.tickSynth(modeKey);
      }

      stopSynth() {
        clearTimeout(this.synthTimer);
        this.synthTimer = null;
      }

      voiceSynthNote(freq, durSec, type, vol, cutoff, isPad) {
        if (!this.ctx || !freq) return;
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const overtone = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const env = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);

        overtone.type = 'sine';
        overtone.frequency.setValueAtTime(freq * 2, now);

        const overtoneGain = this.ctx.createGain();
        overtoneGain.gain.value = isPad ? 0.04 : 0.11;

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(cutoff, now);
        filter.frequency.exponentialRampToValueAtTime(Math.max(320, cutoff * 0.42), now + durSec * 1.1);

        const attack = isPad ? 0.14 : 0.025;
        env.gain.setValueAtTime(0.0001, now);
        env.gain.linearRampToValueAtTime(vol, now + attack);
        env.gain.exponentialRampToValueAtTime(0.0006, now + durSec * 1.35);

        osc.connect(filter);
        overtone.connect(overtoneGain);
        overtoneGain.connect(filter);
        filter.connect(env);
        env.connect(this.master);

        osc.start(now);
        overtone.start(now);
        osc.stop(now + durSec * 1.4);
        overtone.stop(now + durSec * 1.4);
      }

      tickSynth(modeKey) {
        if (!this.isStarted || this.currentMode !== modeKey) return;
        const score = FALLBACK_SCORES[modeKey];
        if (!score) return;
        const step = score.steps[this.synthStep % score.steps.length];
        const beatSec = 60 / score.tempo;
        const stepSec = step.d * beatSec;

        if (step.n) {
          this.voiceSynthNote(step.n, stepSec, score.leadType, 0.22, score.brightness, false);
        }
        if (step.c) {
          step.c.forEach(chordNote => {
            this.voiceSynthNote(chordNote, stepSec * 2.1, score.padType, 0.06, score.brightness * 0.65, true);
          });
        }

        this.synthStep++;
        this.synthTimer = setTimeout(() => this.tickSynth(modeKey), stepSec * 1000);
      }
    }

    const music = new HybridMusicController();

    /**
     * =========================================================================
     * 4. AMBIENT PETAL & BOKEH PAINTER
     * =========================================================================
     */
    const canvas = document.getElementById('ambianceCanvas');
    const ctx = canvas.getContext('2d');
    let motes = [];
    let currentAmbiance = 'hibiscus';
    let canvasWidth = 0;
    let canvasHeight = 0;
    let animationFrameId = null;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    function resizeCanvas() {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
      canvasWidth = window.innerWidth;
      canvasHeight = window.innerHeight;
      canvas.width = Math.round(canvasWidth * pixelRatio);
      canvas.height = Math.round(canvasHeight * pixelRatio);
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function burstMotes(count = 18) {
      if (reducedMotion.matches) return;
      const cy = canvasHeight / 2;
      const centerX = canvasWidth / 2;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.35;
        const speed = 1.1 + Math.random() * 2.4;
        motes.push({
          x: centerX,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 0.4,
          size: 3.5 + Math.random() * 4.5,
          alpha: 0.85,
          fade: 0.012 + Math.random() * 0.008,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.04,
          kind: currentAmbiance
        });
      }
    }

    function spawnAmbientMote() {
      if (motes.length > 38) return;
      const w = canvasWidth;
      const h = canvasHeight;

      if (currentAmbiance === 'hibiscus') {
        motes.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.32,
          vy: -0.22 - Math.random() * 0.35,
          size: 2.2 + Math.random() * 3.5,
          alpha: 0.65,
          fade: 0.0032,
          rot: 0,
          vRot: 0,
          kind: 'hibiscus'
        });
      } else if (currentAmbiance === 'wisteria') {
        motes.push({
          x: Math.random() * w,
          y: -14,
          vx: (Math.random() - 0.5) * 0.55,
          vy: 0.45 + Math.random() * 0.7,
          size: 4.5 + Math.random() * 4.5,
          alpha: 0.78,
          fade: 0.0026,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.025,
          kind: 'wisteria'
        });
      } else if (currentAmbiance === 'magnolia') {
        motes.push({
          x: Math.random() * w,
          y: -16,
          vx: -0.35 + (Math.random() - 0.5) * 0.65,
          vy: 0.5 + Math.random() * 0.8,
          size: 5.5 + Math.random() * 5,
          alpha: 0.75,
          fade: 0.0025,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.022,
          kind: 'magnolia'
        });
      }
    }

    function renderAmbiance() {
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);
      if (Math.random() < 0.24) spawnAmbientMote();

      for (let i = motes.length - 1; i >= 0; i--) {
        const m = motes[i];
        m.x += m.vx;
        m.y += m.vy;
        m.rot += m.vRot;
        m.alpha -= m.fade;

        if (m.alpha <= 0) {
          motes.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, m.alpha);

        if (m.kind === 'wisteria') {
          ctx.translate(m.x, m.y);
          ctx.rotate(m.rot);
          ctx.fillStyle = i % 4 === 0 ? 'rgba(186, 46, 56, 0.55)' : 'rgba(255, 255, 250, 0.88)';
          ctx.beginPath();
          ctx.moveTo(0, -m.size);
          ctx.quadraticCurveTo(m.size * 0.85, 0, 0, m.size);
          ctx.quadraticCurveTo(-m.size * 0.85, 0, 0, -m.size);
          ctx.fill();
        } else if (m.kind === 'magnolia') {
          ctx.translate(m.x, m.y);
          ctx.rotate(m.rot);
          ctx.fillStyle = '#f3d4cc';
          ctx.beginPath();
          ctx.moveTo(0, -m.size);
          ctx.quadraticCurveTo(m.size * 0.9, 0, 0, m.size);
          ctx.quadraticCurveTo(-m.size * 0.9, 0, 0, -m.size);
          ctx.fill();
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#ffd5c8';
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.size, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      animationFrameId = requestAnimationFrame(renderAmbiance);
    }

    function startAmbiance() {
      if (animationFrameId === null && !document.hidden && !reducedMotion.matches) {
        animationFrameId = requestAnimationFrame(renderAmbiance);
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      } else {
        startAmbiance();
      }
    });

    reducedMotion.addEventListener('change', () => {
      if (reducedMotion.matches) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
        motes = [];
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);
      } else {
        startAmbiance();
      }
    });

    /**
     * =========================================================================
     * 5. SEAMLESS MODE TRANSITION CONTROLLER
     * =========================================================================
     */
    let activeModeKey = 'lovely';
    let hasStartedAudio = false;
    let heartTransitionTimeout = null;
    let titleTransitionTimeout = null;

    function ensureAudioStarted(modeKey = activeModeKey) {
      if (!hasStartedAudio) {
        hasStartedAudio = true;
        music.setMode(modeKey);
        const whisper = document.getElementById('whisperHint');
        whisper.textContent = 'Draw a song into the heart · or tap to switch';
      }
    }

    function switchMode(newModeKey) {
      ensureAudioStarted(newModeKey);
      if (newModeKey === activeModeKey) {
        burstMotes(14);
        return;
      }

      activeModeKey = newModeKey;
      const mode = MODES[newModeKey];
      const songMeta = SONG_CONFIG[newModeKey];

      // 1. Update body class & CSS custom properties smoothly
      document.body.className = `mode-${newModeKey} relative w-full h-full overflow-hidden flex flex-col items-center justify-between`;
      Object.entries(mode.themeVars).forEach(([k, v]) => {
        document.documentElement.style.setProperty(k, v);
      });
      document.documentElement.style.setProperty('--beat-sec', `${(60 / mode.tempo) * 2}s`);

      // 2. Crossfade frosted-glass album artwork backdrops
      document.querySelectorAll('.album-layer').forEach(el => el.classList.remove('is-active'));
      document.getElementById(mode.bgId).classList.add('is-active');

      // 3. Morph heart SVG & motion rhythm
      const artLayer = document.getElementById('heartArtLayer');
      const motionWrapper = document.getElementById('heartMotionWrapper');
      clearTimeout(heartTransitionTimeout);
      clearTimeout(titleTransitionTimeout);
      artLayer.classList.add('heart-morph-out');

      heartTransitionTimeout = setTimeout(() => {
        artLayer.innerHTML = mode.svg;
        motionWrapper.className = `heart-motion ${mode.motionClass} w-40 h-40 sm:w-48 sm:h-48 flex items-center justify-center`;
        artLayer.classList.remove('heart-morph-out');
      }, 280);

      // 4. Crossfade typography
      const titleEl = document.getElementById('modeHeading');
      const subEl = document.getElementById('modeSubtitle');
      titleEl.style.opacity = '0';
      subEl.style.opacity = '0';
      titleTransitionTimeout = setTimeout(() => {
        titleEl.textContent = songMeta.title;
        subEl.textContent = songMeta.artist;
        titleEl.style.opacity = '1';
        subEl.style.opacity = '0.65';
      }, 240);

      // 5. Update active pill highlight
      document.querySelectorAll('.mode-charm').forEach(btn => {
        const isSelected = btn.dataset.mode === newModeKey;
        btn.classList.toggle('is-selected', isSelected);
        btn.setAttribute('aria-pressed', String(isSelected));
      });

      // 6. Switch ambient particles & crossfade song
      currentAmbiance = mode.particleType;
      burstMotes(22);
      music.setMode(newModeKey);
    }

    /**
     * =========================================================================
     * 6. ORBITING CHARMS: DUAL TAP + MAGNETIC DRAG-TO-HEART INTERACTION
     * =========================================================================
     */
    function setupOrbitingButton(btnEl) {
      const modeKey = btnEl.dataset.mode;
      const sanctuary = document.getElementById('heartSanctuary');

      let startX = 0;
      let startY = 0;
      let dragging = false;
      let ghost = null;

      function isInsideHeartZone(x, y) {
        const rect = sanctuary.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        return Math.hypot(x - cx, y - cy) <= rect.width * 0.65;
      }

      function handleDown(e) {
        e.stopPropagation();
        const pt = e.touches ? e.touches[0] : e;
        startX = pt.clientX;
        startY = pt.clientY;
        dragging = false;

        window.addEventListener('pointermove', handleMove, { passive: false });
        window.addEventListener('pointerup', handleUp);
        window.addEventListener('touchmove', handleMove, { passive: false });
        window.addEventListener('touchend', handleUp);
      }

      function handleMove(e) {
        const pt = e.touches ? e.touches[0] : e;
        const dist = Math.hypot(pt.clientX - startX, pt.clientY - startY);

        if (!dragging && dist > 8) {
          dragging = true;
          const rect = btnEl.getBoundingClientRect();
          ghost = btnEl.cloneNode(true);
          ghost.classList.add('is-dragging');
          ghost.style.width = `${rect.width}px`;
          ghost.style.height = `${rect.height}px`;
          ghost.style.left = `${rect.left}px`;
          ghost.style.top = `${rect.top}px`;
          document.body.appendChild(ghost);
          btnEl.style.opacity = '0.28';
        }

        if (dragging && ghost) {
          e.preventDefault();
          ghost.style.left = `${pt.clientX - ghost.offsetWidth / 2}px`;
          ghost.style.top = `${pt.clientY - ghost.offsetHeight / 2}px`;

          if (isInsideHeartZone(pt.clientX, pt.clientY)) {
            sanctuary.classList.add('is-targeted');
          } else {
            sanctuary.classList.remove('is-targeted');
          }
        }
      }

      function handleUp(e) {
        window.removeEventListener('pointermove', handleMove);
        window.removeEventListener('pointerup', handleUp);
        window.removeEventListener('touchmove', handleMove);
        window.removeEventListener('touchend', handleUp);

        const pt = e.changedTouches ? e.changedTouches[0] : e;

        if (dragging) {
          sanctuary.classList.remove('is-targeted');
          btnEl.style.opacity = '1';
          if (ghost) {
            ghost.remove();
            ghost = null;
          }
          if (pt && isInsideHeartZone(pt.clientX, pt.clientY)) {
            switchMode(modeKey);
          }
        } else {
          switchMode(modeKey);
        }

        dragging = false;
      }

      btnEl.addEventListener('pointerdown', handleDown);
    }

    /**
     * =========================================================================
     * 7. INITIALIZATION
     * =========================================================================
     */
    window.addEventListener('load', () => {
      preloadAlbumCovers();
      document.getElementById('heartArtLayer').innerHTML = MODES.lovely.svg;
      startAmbiance();

      // Bind ONLY the 3 orbiting mode buttons
      document.querySelectorAll('.mode-charm').forEach(setupOrbitingButton);

      // Unlock audio on first touch anywhere
      document.body.addEventListener('pointerdown', () => {
        ensureAudioStarted();
      }, { once: true });
    });
  </script>
</body>
